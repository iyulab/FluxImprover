name: Publish to NuGet

on:
  push:
    branches: [main]
    paths:
      - 'Directory.Build.props'
  workflow_dispatch:

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  NUGET_SOURCE: https://api.nuget.org/v3/index.json

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Detected version: $VERSION"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Pack every packable project, not just the one named after the repository. Packing a single
      # csproj left FluxImprover.LMSupply — packable, and in the solution since it was added — never
      # published at any version. Nothing failed: a package that is never produced cannot fail to push.
      - name: Pack
        run: |
          dotnet pack FluxImprover.slnx \
            --no-build \
            --configuration Release \
            --output ./nupkgs \
            -p:PackageVersion=${{ steps.version.outputs.version }}

      - name: Verify packages
        run: |
          ls -la ./nupkgs/
          version="${{ steps.version.outputs.version }}"
          missing=0
          # Assumes PackageId matches the csproj filename, which holds in this repository (verified).
          # If a project ever declares a differing PackageId, read it from the csproj instead — a
          # mismatch here would report a package as missing when it was in fact produced, and a gate
          # that cries wolf gets ignored.
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' FluxImprover.slnx); do
            id=$(basename "$csproj" .csproj)
            if [ ! -f "./nupkgs/${id}.${version}.nupkg" ]; then
              echo "::error::${id}.${version}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Push to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source ${{ env.NUGET_SOURCE }} \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: ./nupkgs/*.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
