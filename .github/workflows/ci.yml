name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        # Category=Integration drives real local models via LMSupply.Generator (multi-GB download,
        # CPU-bound inference) — excluded here the same way FileFlux/memory-indexer exclude it; run
        # locally with `dotnet test --filter-trait "Category=Integration"` to exercise it.
        # xUnit v3/MTP has no VSTest-style single-expression filter; see plan doc's compound-filter
        # translation (repeated filter-not-trait flags, ANDed).
        run: dotnet test --no-build --configuration Release --verbosity normal --report-trx --results-directory ./test-results --filter-not-trait "Category=Integration" --hangdump --hangdump-timeout 5m

